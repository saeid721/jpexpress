<!doctype html>
<html lang="en" class="page-portal">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#2B3990">
    <meta name="robots" content="noindex,nofollow">
    <title>My Account | JP Express Customer Portal</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/customer-portal.css">
</head>

<body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="shell" id="shell">
        <!-- ===== SIDEBAR (desktop) / DRAWER (mobile) ===== -->
        <aside class="sidebar" id="sidebar" aria-label="Portal navigation">
            <div class="sb-head">
                <a class="brand" href="index.html" aria-label="JP Express home">
                    <img src="assets/logo.png" alt="JP Express">
                    <span><b>Customer Portal</b><small>SHIP WITH CONFIDENCE</small></span>
                </a>
                <button class="icon-btn sb-close" data-action="closeNav" aria-label="Close menu"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>

            <button class="acct-switch" id="acctSwitch" data-action="openSwitcher" aria-haspopup="dialog">
                <span class="acct-ico" id="acctIco"></span>
                <span class="acct-txt"><b id="acctName">Personal account</b><small id="acctRole">Owner</small></span>
                <i class="fa-solid fa-arrows-up-down"></i>
            </button>

            <nav class="side-nav" id="sideNav" aria-label="Main"></nav>

            <div class="sb-foot">
                <div class="secure-note"><i class="fa-solid fa-shield-halved"></i>
                    <span><b>Your account, protected</b><small>Access follows your role in the active account.</small></span>
                </div>
                <a class="side-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to website</a>
            </div>
        </aside>
        <div class="scrim" id="scrim" data-action="closeNav"></div>

        <!-- ===== MAIN ===== -->
        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" data-action="openNav" aria-label="Open menu"><i
                        class="fa-solid fa-bars"></i></button>
                <div class="crumb"><span>My account</span><i class="fa-solid fa-chevron-right"></i><b
                        id="crumbTitle">Dashboard</b></div>

                <form class="top-search" id="topSearch" role="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="topSearchInput" type="search" placeholder="Find a shipment ID" autocomplete="off"
                        aria-label="Find a shipment by ID">
                </form>

                <div class="top-actions">
                    <a class="btn btn-primary btn-sm top-new" href="#create" data-nav="create"><i
                            class="fa-solid fa-plus"></i><span>New shipment</span></a>
                    <a class="icon-btn" href="contact.html" aria-label="Contact JP Express" title="Contact JP Express"><i
                            class="fa-regular fa-circle-question"></i></a>
                    <button class="icon-btn bell" data-nav="notifications" aria-label="Notifications"><i
                            class="fa-regular fa-bell"></i><em id="bellDot" hidden>0</em></button>
                    <button class="profile-btn" data-nav="profile" aria-label="Profile and security">
                        <span class="avatar" id="meAvatar">RK</span>
                        <span class="profile-meta"><b id="meName">Rahim Khan</b><small id="meSub">Personal customer</small></span>
                    </button>
                </div>
            </header>

            <main id="view" class="content" tabindex="-1" aria-live="polite"></main>

            <footer class="portal-foot">
                <span>© 2026 JP Express. All rights reserved.</span>
                <span><a href="privacy-policy.html">Privacy</a><a href="terms-of-service.html">Terms</a><a
                        href="contact.html">Support</a></span>
            </footer>
        </div>
    </div>

    <!-- ===== MOBILE BOTTOM BAR ===== -->
    <nav class="tabbar" aria-label="Quick navigation">
        <a href="#dashboard" data-nav="dashboard"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#shipments" data-nav="shipments"><i class="fa-solid fa-box"></i><span>Shipments</span></a>
        <a href="#create" data-nav="create" class="tab-main" aria-label="New shipment"><i
                class="fa-solid fa-plus"></i></a>
        <a href="#tracking" data-nav="tracking"><i class="fa-solid fa-location-crosshairs"></i><span>Track</span></a>
        <button type="button" data-action="openNav"><i class="fa-solid fa-grip"></i><span>More</span></button>
    </nav>

    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/customer-portal.js"></script>
</body>

</html>
